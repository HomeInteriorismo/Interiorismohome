name: Keep Supabase alive

# Supabase gratis pausa proyectos "inactivos". Desde nov 2026 solo leer no bastó,
# así que cada visita ESCRIBE un latido en la base (función public.ping, ver supabase/002_latido.sql).
on:
  schedule:
    - cron: "17 15 */2 * *"   # cada 2 días, 9:17 am hora de Zihuatanejo
  workflow_dispatch:           # botón "Run workflow" para probar a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Latido en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY"; exit 1
          fi
          for intento in 1 2 3; do
            code=$(curl -s -o resp.txt -w "%{http_code}" --max-time 30 -X POST \
              "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "Intento $intento: Supabase respondió $code $(cat resp.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          # Si falla, GitHub te manda correo: señal de que el proyecto se pausó
          exit 1
